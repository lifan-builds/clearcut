name: Checks

on:
  pull_request:
    paths:
      - 'common/**'
      - 'catalogs/**'
      - 'scripts/**'
      - 'api/**'
      - 'app.py'
      - 'pyproject.toml'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: python scripts/check.py -q
      - run: ruff check .
      - run: node --test catalogs/fresh-powder/tests/*.cjs
      - run: node --check common/deal_common/catalog/static/catalog.js catalogs/fresh-powder/src/aggregator/web/static/*.js
