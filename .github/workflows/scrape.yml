name: Scrape Deals

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      refresh_reviews:
        description: Refresh expert reviews as well as prices
        type: boolean
        default: false
      stores:
        description: Optional comma-separated retailer names to refresh only those sources
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: freshpowder-data-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,scraping]'
      - name: Verify parsers and data contracts
        env:
          DATABASE_PATH: /tmp/freshpowder-tests.db
          AUTH_DB_PATH: /tmp/freshpowder-test-auth.db
        run: python scripts/check.py -q
      - name: Restore previous snapshot and price history
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p catalogs/fresh-powder/data && gh release download latest-data --repo lifan-builds/clearcut-data --pattern deals.db --dir catalogs/fresh-powder/data
      - name: Determine scraper runtime
        id: scraper-runtime
        env:
          REFRESH_STORES: ${{ inputs.stores }}
        run: python scripts/snow_refresh_runtime.py
      - name: Install Playwright Chromium
        if: steps.scraper-runtime.outputs.browser_required == 'true'
        run: playwright install chromium --with-deps
      - name: Run scraper
        env:
          REFRESH_STORES: ${{ inputs.stores }}
        run: |
          args=(--delay 2 --max-pages 30 --report scrape-report.json)
          if [ -n "$REFRESH_STORES" ]; then
            IFS=',' read -ra selected <<< "$REFRESH_STORES"
            args+=(--min-stores "${#selected[@]}")
            for store in "${selected[@]}"; do args+=(--store "$store"); done
          else
            args+=(--min-stores 20)
          fi
          snow-deals-agg refresh "${args[@]}"
      - name: Refresh expert reviews
        if: ${{ inputs.refresh_reviews }}
        run: snow-deals-agg fetch-reviews --delay 2 --max-reviews 200
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-quality
          path: scrape-report.json
          if-no-files-found: ignore
      - name: Publish validated snapshot
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          python -c "import sqlite3; c=sqlite3.connect('catalogs/fresh-powder/data/deals.db'); c.execute('VACUUM'); c.close()"
          gh release upload latest-data catalogs/fresh-powder/data/deals.db --clobber --repo lifan-builds/clearcut-data
          gh release edit latest-data --repo lifan-builds/clearcut-data --notes "Validated snapshot from run $GITHUB_RUN_ID"
      - name: Trigger Render redeploy with fresh snapshot
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is required."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 --request POST "$RENDER_DEPLOY_HOOK_URL" --output /dev/null
      - name: Verify production snapshot
        run: python scripts/verify_live_snapshot.py scrape-report.json
      - name: Send rare-deal alerts when configured
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/send_deal_alerts.py --deals-db catalogs/fresh-powder/data/deals.db
